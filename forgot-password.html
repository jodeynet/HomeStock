<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>Forgot password — HomeStock</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tulip-bg min-h-screen text-slate-100 antialiased selection:bg-emerald-600 selection:text-white">
    <main class="min-h-screen flex items-center justify-center p-4 sm:p-8">
        <section class="w-full max-w-md rounded-3xl border border-slate-700/70 bg-slate-950/85 p-6 shadow-2xl backdrop-blur-xl sm:p-10">
            <a href="login.html" class="mb-9 flex w-fit items-center gap-2">
                <span class="h-9 w-9 overflow-hidden">
                    <img src="HomeStockicon.jpeg" alt="" class="h-full w-full object-cover">
                </span>
                <span class="font-bold">HomeStock</span>
            </a>
            <div class="mb-7">
                <span class="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl border border-emerald-500/20 bg-emerald-500/10">
                    <i class="ph ph-lock-key-open text-2xl text-emerald-300"></i>
                </span>
                <p class="mb-2 text-sm font-semibold text-emerald-300">Account recovery</p>
                <h1 class="text-3xl font-bold tracking-tight">Forgot your password?</h1>
                <p class="mt-3 text-sm leading-relaxed text-slate-400">Enter the email address you used for HomeStock. If there’s an account for it, we’ll send a secure link to reset your password.</p>
            </div>
            <form id="forgotPasswordForm" class="space-y-4" onsubmit="event.preventDefault(); sendPasswordResetEmail();">
                <div>
                    <label for="recoveryEmail" class="mb-2 block text-sm font-medium text-slate-300">Email address</label>
                    <input id="recoveryEmail" name="email" type="email" autocomplete="email" required autofocus placeholder="you@example.com" class="w-full rounded-xl border border-slate-700 bg-slate-900/80 px-4 py-3.5 text-sm text-white transition placeholder:text-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                </div>
                <p id="forgotPasswordStatus" role="status" aria-live="polite" class="hidden text-sm leading-relaxed"></p>
                <button id="sendResetLinkButton" type="submit" class="w-full rounded-xl bg-emerald-600 py-3.5 font-semibold text-white shadow-lg shadow-emerald-700/20 transition hover:bg-emerald-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400">Send reset link</button>
            </form>
            <div class="mt-6 rounded-xl border border-slate-800 bg-slate-900/50 p-3.5 text-xs leading-relaxed text-slate-400">
                <i class="ph ph-info mr-1 text-indigo-300"></i>
                Check your spam folder if the email doesn’t arrive. Reset links expire for your security.
            </div>
            <a href="login.html" class="mt-7 flex items-center justify-center gap-2 text-sm font-semibold text-slate-300 transition hover:text-white">
                <i class="ph ph-arrow-left"></i> Back to log in
            </a>
        </section>
    </main>
    <script src="forgot-password.js?v=recovery-email-diagnostics"></script>
</body>
</html>
