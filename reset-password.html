<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>Reset password — HomeStock</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        const recoveryHash = new URLSearchParams(window.location.hash.slice(1));
        const recoveryQuery = new URLSearchParams(window.location.search);
        window.HOMESTOCK_PASSWORD_RECOVERY_LINK =
            recoveryHash.get('type') === 'recovery'
            || recoveryQuery.get('type') === 'recovery'
            || recoveryQuery.has('code')
            || (localStorage.getItem('homestock_password_recovery_pending') === 'true'
                && (recoveryHash.has('access_token') || recoveryHash.has('code')));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="password-policy.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tulip-bg min-h-screen text-slate-100 antialiased selection:bg-emerald-600 selection:text-white">
    <main class="min-h-screen flex items-center justify-center p-4 sm:p-8">
        <section class="w-full max-w-md rounded-3xl border border-slate-700/70 bg-slate-950/85 p-6 shadow-2xl backdrop-blur-xl sm:p-10">
            <a href="login.html" class="mb-8 flex w-fit items-center gap-2">
                <span class="h-9 w-9 overflow-hidden">
                    <img src="HomeStockicon.jpeg" alt="" class="h-full w-full object-cover">
                </span>
                <span class="font-bold">HomeStock</span>
            </a>
            <div class="mb-6">
                <p class="mb-2 text-sm font-semibold text-emerald-300">Account security</p>
                <h1 class="text-3xl font-bold tracking-tight">Reset your password</h1>
                <p class="mt-2 text-sm text-slate-400">Choose a new password for your HomeStock account.</p>
            </div>
            <p id="resetPasswordStatus" role="status" aria-live="polite" class="mb-5 text-sm leading-relaxed text-slate-300">Checking your secure reset link…</p>
            <form id="resetPasswordForm" class="hidden space-y-4" onsubmit="event.preventDefault(); submitPasswordReset();">
                <div>
                    <label for="resetNewPassword" class="mb-1.5 block text-sm font-medium text-slate-300">New password</label>
                    <input id="resetNewPassword" type="password" autocomplete="new-password" minlength="7" required aria-describedby="resetPasswordRequirements" class="w-full rounded-xl border border-slate-700 bg-slate-900/80 px-4 py-3.5 text-sm text-white transition focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                    <p id="resetPasswordRequirements" class="mt-2 text-xs leading-relaxed text-slate-500">At least 7 characters, uppercase and lowercase letters, a special character, and not common or predictable.</p>
                </div>
                <div>
                    <label for="resetConfirmPassword" class="mb-1.5 block text-sm font-medium text-slate-300">Confirm new password</label>
                    <input id="resetConfirmPassword" type="password" autocomplete="new-password" minlength="7" required class="w-full rounded-xl border border-slate-700 bg-slate-900/80 px-4 py-3.5 text-sm text-white transition focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                </div>
                <button id="resetPasswordSubmit" type="submit" class="w-full rounded-xl bg-emerald-600 py-3.5 font-semibold text-white shadow-lg shadow-emerald-700/20 transition hover:bg-emerald-500">Update password</button>
            </form>
            <a id="resetPasswordLoginLink" href="login.html" class="mt-6 inline-block text-sm font-semibold text-emerald-300 hover:text-emerald-200">Back to log in</a>
        </section>
    </main>
    <script src="password-recovery.js?v=recovery-link-routing-2"></script>
</body>
</html>
